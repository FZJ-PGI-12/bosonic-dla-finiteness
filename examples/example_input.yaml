# example_input.yaml
# Bosonic Lie algebra input file
#
# n_modes : number of bosonic modes
# omegas  : drift frequencies omega_0 ... omega_{n-1}
# generators: list of g_+/g_- defined by (alpha, beta) multi-indices
#   kind  : "+" or "-"
#   alpha : creation exponents     (a†_0)^alpha_0 ... (a†_n)^alpha_n
#   beta  : annihilation exponents  (a_0)^beta_0  ... (a_n)^beta_n
#   label : optional name (recommended for readability)
#   coeff : optional coefficient (default 1.0)

n_modes: 3
omegas: [1.0, 2.0, 3.0]

generators:

  # ── Degree 2: hopping terms ──────────────────────────────────────────────
  - kind:  "+"
    alpha: [1, 0, 0]   # a†_0
    beta:  [0, 1, 0]   # a_1
    description: "g_+(a†_0 a_1)"
    label: "G1"

  - kind:  "-"
    alpha: [1, 0, 0]
    beta:  [0, 1, 0]
    description: "g_-(a†_0 a_1)"
    label: "G2"

  - kind:  "+"
    alpha: [0, 1, 0]   # a†_1
    beta:  [0, 0, 1]   # a_2
    description: "g_+(a†_1 a_2)"
    label: "G3"

  - kind:  "-"
    alpha: [0, 1, 0]
    beta:  [0, 0, 1]
    description: "g_-(a†_1 a_2)"
    label: "G4"

  # ── Degree 3: three-body terms ───────────────────────────────────────────
  - kind:  "+"
    alpha: [1, 0, 0]   # a†_0
    beta:  [0, 1, 1]   # a_1 a_2
    description: "g_+(a†_0 a_1 a_2)"
    label: "G5"

  - kind:  "-"
    alpha: [1, 0, 0]
    beta:  [0, 1, 1]
    description: "g_-(a†_0 a_1 a_2)"
    label: "G6"